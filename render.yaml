# Render blueprint for the API. In Render: New > Blueprint, pick this repository, then
# fill in ANTHROPIC_API_KEY and CRASHTIMATE_CORS_ORIGINS when asked.
# The frontend goes on Vercel: see docs/DEPLOY.md.

services:
  - type: web
    name: crashtimate-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    # The free plan has no disk and sleeps when idle: cached analyses and saved estimates are
    # lost whenever it restarts, and the first request after a sleep takes about a minute.
    # To keep them, switch to `plan: starter` and add:
    #   disk: {name: crashtimate-data, mountPath: /data, sizeGB: 1}
    plan: free
    envVars:
      - key: CRASHTIMATE_DETECTOR
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      # JSON list holding the frontend's address, e.g. ["https://crashtimate.vercel.app"]
      - key: CRASHTIMATE_CORS_ORIGINS
        sync: false
      # Render puts one proxy in front of the app; rate limits need the visitor's address.
      - key: CRASHTIMATE_PROXY_HOPS
        value: "1"
      # Each analysis costs about 3 US cents on Opus, so this caps a day at about 30 cents.
      - key: CRASHTIMATE_DAILY_ANALYSIS_LIMIT
        value: "10"
